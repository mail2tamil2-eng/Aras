name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: WCAG contrast check (all themes)
        run: pnpm tokens:check
      - name: Lint (no raw colours or sizes)
        run: pnpm lint
      - name: Build packages
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Build docs
        run: pnpm docs:build
